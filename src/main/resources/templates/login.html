<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Black Cat Retirement</title>

        <!-- css/Bootstrap -->
        <link th:href="@{/vendor/bootstrap.min.css}" rel="stylesheet"/>
        <link rel="stylesheet" th:href="@{/css/interaction_button.css}">
        <!-- scripts -->
        <script defer th:src="@{/javascript/login.js}"></script>
        <!-- header block -->
        <th:block th:replace="~{fragments/header :: header}"></th:block>

    </head>
    <body>
        <div class="d-flex m-5 align-content-center justify-content-center">
            <div class="border border-dark rounded p-3">
                <h3>Login</h3>

                <div>
                    <label for="email_input" class="form-label">Email</label>
                    <input
                            id="email_input"
                            type="email"
                            name="email"
                            placeholder="Email"
                            class="form-control"
                    />
                </div>

                <div>
                    <label for="password_input" class="form-label">Password</label>
                    <input
                            id="password_input"
                            type="password"
                            name="password"
                            placeholder="Password"
                            class="form-control"
                    />
                    <div id="error_message" class="text-danger small"></div>
                </div>

                <button onclick="login()" class="ms-auto rounded-3 shadow interaction-button">Login</button>
                <button onclick="registerNewCustomer()" class="ms-auto rounded-3 shadow interaction-button">Register new User</button>
            </div>
        </div>
    </body>
</html>
