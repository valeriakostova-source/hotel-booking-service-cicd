<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Black Cat Retirement</title>

    <!-- css/Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/my_reservation.css}"/>
    <link th:href="@{/vendor/bootstrap.min.css}" rel="stylesheet"/>

    <!-- Bootstrap JS (Required for Modals) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- scripts -->
    <script defer th:src="@{/javascript/my_reservation.js}"></script>
    <!-- header block -->
    <th:block th:replace="~{fragments/header :: header}"></th:block>

</head>
<body>
<h1 class="my_reservation_title">My reservations</h1>

<div class="table-wrapper">
    <table id="reservationTable" class="table">
        <thead>
        <tr id="my_reservation_table">
            <th>Check in</th>
            <th>Check out</th>
            <th>Room</th>
            <th>Extra bed</th>
            <th>Total cost</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="table_body">
        <!-- Js script -->
        </tbody>
    </table>
</div>

<div id="errorPopup" class="popup-overlay">
    <div class="popup-box">
        <h3>Unable to update reservation</h3>
        <p>The selected dates are not available. Please choose different dates.</p>

        <div class="popup-buttons">
            <button id="closeErrorPopup" class="popup-btn cancel">Close</button>
        </div>
    </div>
</div>
<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="reviewModalLabel">Leave a Review</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="reviewForm">
                    <input type="hidden" id="reviewRoomNumber">

                    <div class="mb-3">
                        <label for="reviewScore" class="form-label">Rating</label>
                        <select id="reviewScore" class="form-select" required>
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Good</option>
                            <option value="3">3 - Average</option>
                            <option value="2">2 - Poor</option>
                            <option value="1">1 - Terrible</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="reviewContent" class="form-label">Comment</label>
                        <textarea id="reviewContent" class="form-control" rows="4" placeholder="How was your stay?"
                                  required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-dark" onclick="submitReview()">Submit Review</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
