<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Black Cat Retirement</title>

        <!-- css/Bootstrap -->
        <link th:href="@{/vendor/bootstrap.min.css}" rel="stylesheet"/>
        <link rel="stylesheet" th:href="@{/css/update_customer_style.css}">
        <link rel="stylesheet" th:href="@{/css/interaction_button.css}">
        <!-- scripts -->
        <script defer src="/javascript/update.js"></script>
        <!-- header block -->
        <th:block th:replace="~{fragments/header :: header}"></th:block>

    </head>

    <body>
        <div class="update-page">

            <h1>Update Account</h1>

            <div id="error_message" class="text-danger small"></div>

            <form id="update">
                <label>Firstname <br>
                    <input type="text" name="firstname" placeholder="New firstname">
                </label>

                <label>Lastname <br>
                    <input type="text" name="lastname" placeholder="New lastname">
                </label>

                <label>Email <br>
                    <input type="email" name="email" placeholder="New email">
                </label>
                <p id="emailError" class="error-text" style="color:red;"></p>

                <label>Phone Number <br>
                    <input type="text" name="phoneNumber" placeholder="New phone number">
                </label>
                <p id="phoneError" class="error-text" style="color:red;"></p>

                <label>Password <br>
                    <input type="password" name="password" placeholder="New password">
                </label>

                <button type="submit" class="btn-secondary interaction-button">Update</button>
            </form>

            <a href="/mypage" class="btn-secondary interaction-button">Back</a>
        </div>
    </body>
</html>
