name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  schedule:
      - cron: "0 0 * * 6"

jobs:
  valeriatester:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [21]

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ${{secrets.MYSQL_ROOT_PASSWORD}}
          MYSQL_DATABASE: ${{secrets.MYSQL_DATABASE}}
          MYSQL_USER: ${{secrets.BOOKING_DB_USER}}
          MYSQL_PASSWORD: ${{secrets.BOOKING_DB_PASS}}
        ports:
          - 3306:3306
        options:
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
#
      #Checkout code
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and run tests
        run: mvn -B package
        env:
            SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/${{ secrets.MYSQL_DATABASE }}
            BOOKING_DB_USER: ${{ secrets.BOOKING_DB_USER }}
            BOOKING_DB_PASS: ${{ secrets.BOOKING_DB_PASS }}
            JWT_SECRET: ${{ secrets.JWT_SECRET }}



      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_HUB_USERNAME}}
          password: ${{ secrets.DOCKER_HUB_SECRET }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        run: |
          docker buildx build \
          --platform linux/amd64,linux/arm64 \
           -t valeriakostova/booking-service-cicd:1.0
          --push .



